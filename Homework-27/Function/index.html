<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/SVG/lebid.svg">
  <!-- Styles -->
  <link rel="stylesheet" href="./assets/css/pico.min.css">
  <link rel="stylesheet" href="./assets/css/pico.colors.min.css">

  <!-- Scripts -->
  <script src="./assets/js/script.js" defer></script>

  <title>Function</title>
</head>

<body>
  <section class="container">
    <article class="pico-background-blue-300">
      <h4 class="pico-color-zinc-750">
        Напиши всі можливі варіанти створення функцій.</h4>
      <img src="./assets/img/func.png" alt="fucntions">
    </article>

    <article class="pico-background-blue-300">
      <h4 class="pico-color-zinc-750">Створи функцію, яка буде виводити кількість переданих їй аргументів.</h4>
      <input type="text" name="text" id="args" placeholder="напишть тут будь-що" aria-label="Text">
      <button type="button" onclick="countArgs()" class="contrast">Визначити кількість</button>

      <p id="count" class="pico-color-zinc-750"></p>
    </article>

    <article class="pico-background-blue-300">
      <h4 class="pico-color-zinc-750">Напиши функцію, яка приймає 2 числа і повертає : <br>
        -1, якщо перше число менше, ніж друге; <br>
        1 - якщо перше число більше, ніж друге; <br>
        0 - якщо числа рівні.</h4>
      <input type="number" name="number" id="num1" placeholder="add first number" aria-label="Number">
      <input type="number" name="number" id="num2" placeholder="add second number" aria-label="Number">
      <button type="button" onclick="takeNambers()" class="contrast">Дізнатися</button>

      <p id="result"></p>
    </article>
  </section>
</body>

</html>
